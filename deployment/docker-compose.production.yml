version: '3.8'

services:
  # PostgreSQL 16 Database - Production
  postgres:
    image: postgres:16-alpine
    container_name: churchill_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups  # Database backups location
    networks:
      - churchill_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Only expose on localhost for security
    ports:
      - "127.0.0.1:5432:5432"

  # Redis - Production
  redis:
    image: redis:7-alpine
    container_name: churchill_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-churchillredis2025}
    volumes:
      - redis_data_prod:/data
    networks:
      - churchill_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend - Production
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: churchill/backend:latest
    container_name: churchill_backend_prod
    restart: always
    env_file:
      - .env.production
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - backend_uploads_prod:/app/uploads
      - backend_logs_prod:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - churchill_network
    # Only expose to nginx, not externally
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  # Celery Worker - Production
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: churchill/backend:latest
    container_name: churchill_celery_worker_prod
    restart: always
    env_file:
      - .env.production
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - backend_uploads_prod:/app/uploads
      - backend_logs_prod:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - churchill_network
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4

  # Celery Beat - Production
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: churchill/backend:latest
    container_name: churchill_celery_beat_prod
    restart: always
    env_file:
      - .env.production
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - backend_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - churchill_network
    command: celery -A app.celery_app beat --loglevel=info

  # Nginx Reverse Proxy - Production
  nginx:
    image: nginx:alpine
    container_name: churchill_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs_prod:/var/log/nginx
      - letsencrypt_certs:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - churchill_network

  # Certbot for SSL - Production
  certbot:
    image: certbot/certbot
    container_name: churchill_certbot_prod
    restart: unless-stopped
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  backend_uploads_prod:
    driver: local
  backend_logs_prod:
    driver: local
  nginx_logs_prod:
    driver: local
  letsencrypt_certs:
    driver: local
  letsencrypt_www:
    driver: local

networks:
  churchill_network:
    driver: bridge
