# Churchill Application Portal - Backend API
# HTTP configuration (will redirect to HTTPS after SSL setup)

upstream backend_api {
    server backend:8000;
}

# HTTP Server - Redirect to HTTPS (after SSL setup)
server {
    listen 80;
    server_name 72.61.225.229 portal.churchilleducation.edu.au api.churchilleducation.edu.au;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporary: Allow HTTP for initial setup
    # After SSL is configured, uncomment the redirect below
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # API Backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin Panel UI
    location /api/v1/admin-panel/ {
        proxy_pass http://backend_api/api/v1/admin-panel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (if needed)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media/Uploads (protected, should require auth)
    location /uploads/ {
        internal;
        alias /app/uploads/;
    }
}

